name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Fetch Hermes Agent
        run: |
          git clone --depth=1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          cd /tmp/hermes-agent && uv sync --group dev

      - name: Validate plugin
        working-directory: /tmp/hermes-agent
        run: |
          uv run hermes plugins validate $GITHUB_WORKSPACE --install-deps

      - name: Run tests
        working-directory: /tmp
        run: |
          /tmp/hermes-agent/.venv/bin/python -m pytest -q $GITHUB_WORKSPACE/tests/
